<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title> Справочник законов | Сан-Андреас</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="menuToggleBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    </button>
                    <div class="logo" id="logoBtn">
                        <span class="logo-icon" id="secretTrigger">⚖️</span>
                        <div>
                            <h1>Сан-Андреас</h1>
                            <p>Справочник законов</p>
                        </div>
                    </div>
                </div>

                <button class="fav-tab-btn" id="favTabBtn" onclick="changeSection('__favourites__')">
                    <span class="fav-tab-icon">★</span>
                    <span class="fav-tab-label">Избранное</span>
                    <span class="fav-badge" id="favBadge" style="display:none;">0</span>
                </button>

                <div class="header-right">
                    <div class="search-col">
                        <div class="search-wrapper">
                            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="M21 21L15 15"/></svg>
                            <input type="text" id="globalSearch" class="search-input" placeholder="Глобальный поиск по всем разделам..." autocomplete="off" name="global-search-unique">
                        </div>
                        <div class="search-credit">by Pablo Klein &amp; Lener Klein</div>
                    </div>
                    <div class="auth-block" id="authBlock">
                        <button class="auth-btn" id="authOpenBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <span>Войти / Регистрация</span>
                        </button>
                    </div>
                    <div class="user-block" id="userBlock" style="display:none;">
                        <div class="user-avatar" id="userAvatar">?</div>
                        <div class="user-info">
                            <span class="user-name" id="userNameDisplay"></span>
                            <span class="user-role-badge" id="userRoleBadge"></span>
                        </div>
                        <button class="logout-btn" id="logoutBtn" title="Выйти">✕</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar desktop-only">
                <nav class="sidebar-nav" id="desktopSidebarNav"></nav>
            </aside>
            <main class="main-content">
                <div class="content-header">
                    <h2 class="content-title" id="sectionTitle">⚖️ Уголовный кодекс</h2>
                    <div class="stats" id="stats"></div>
                </div>
                <div id="globalSearchResults" class="global-search-results" style="display:none;">
                    <div class="global-search-header">
                        <span>🔍 Результаты поиска</span>
                        <button class="clear-search-btn" id="clearSearchBtn">✕ Очистить</button>
                    </div>
                    <div id="globalSearchList" class="articles-list"></div>
                </div>
                <div class="filters-bar" id="filtersBar"></div>
                <div id="loadingSpinner" style="display:none;text-align:center;padding:40px;color:#888;">⏳ Загрузка...</div>
                <div class="articles-list" id="articlesList"></div>
            </main>
        </div>
    </div>

    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
    <div class="mobile-sidebar" id="mobileSidebar">
        <div class="mobile-sidebar-header">
            <span class="mobile-sidebar-title">📚 Меню</span>
            <button class="mobile-sidebar-close" id="closeSidebarBtn">✕</button>
        </div>
        <nav class="sidebar-nav" id="mobileSidebarNav"></nav>
    </div>

    <div class="modal-overlay" id="authModal" style="display:none;">
        <div class="modal">
            <button class="modal-close" id="authModalClose">✕</button>
            <div class="modal-tabs">
                <button class="modal-tab active" id="tabLogin" onclick="switchAuthTab('login')">Войти</button>
                <button class="modal-tab" id="tabReg" onclick="switchAuthTab('reg')">Регистрация</button>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="loginUsername" class="form-input" placeholder="Ваш логин" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Пароль" autocomplete="current-password">
                </div>
                <div class="form-error" id="loginError"></div>
                <button class="form-submit" id="loginSubmit">Войти</button>
            </div>
            <div id="regForm" style="display:none;">
                <div class="modal-note">📝 Только логин и пароль. Почта не нужна.</div>
                <div class="form-group">
                    <label>Логин <span class="hint">3–32 символа, буквы/цифры/_</span></label>
                    <input type="text" id="regUsername" class="form-input" placeholder="Придумайте логин" autocomplete="new-username">
                </div>
                <div class="form-group">
                    <label>Пароль <span class="hint">минимум 6 символов</span></label>
                    <input type="password" id="regPassword" class="form-input" placeholder="Придумайте пароль" autocomplete="new-password">
                </div>
                <div class="form-error" id="regError"></div>
                <button class="form-submit" id="regSubmit">Создать аккаунт</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="adminPwModal" style="display:none;">
        <div class="modal modal-sm">
            <button class="modal-close" onclick="document.getElementById('adminPwModal').style.display='none'">✕</button>
            <div class="modal-title">🔐 Доступ к панели</div>
            <div class="form-group">
                <input type="password" id="adminPwInput" class="form-input" placeholder="Пароль администратора" autocomplete="off">
            </div>
            <div class="form-error" id="adminPwError"></div>
            <button class="form-submit" id="adminPwSubmit">Войти</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminPanel" style="display:none;">
        <div class="modal modal-wide">
            <button class="modal-close" onclick="closeAdmin()">✕</button>
            <div class="admin-header">
                <span class="admin-title">⚙️ Административная панель</span>
                <div class="admin-tabs">
                    <button class="admin-tab active" onclick="showAdminTab('content')">📝 Контент</button>
                    <button class="admin-tab" onclick="showAdminTab('users')">👥 Пользователи</button>
                    <button class="admin-tab" onclick="showAdminTab('log')">📋 Лог</button>
                </div>
            </div>

            <div id="adminTabContent" class="admin-tab-body">
                <div class="admin-actions">
                    <button class="admin-action-btn" onclick="openAdminAction('add')">➕ Добавить</button>
                    <button class="admin-action-btn" onclick="openAdminAction('edit')">✏️ Изменить</button>
                    <button class="admin-action-btn danger" onclick="openAdminAction('delete')">🗑️ Удалить</button>
                </div>
                <div id="adminActionArea"></div>
            </div>

            <div id="adminTabUsers" class="admin-tab-body" style="display:none;">
                <div id="adminUsersList"></div>
            </div>

            <div id="adminTabLog" class="admin-tab-body" style="display:none;">
                <div id="adminLogList"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
