<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title> Справочник законов | Сан-Андреас</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="menuToggleBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </button>
                    <div class="logo">
                        <span class="logo-icon">⚖️</span>
                        <div>
                            <h1>Сан-Андреас</h1>
                            <p>Справочник законов</p>
                        </div>
                    </div>
                </div>
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="10" cy="10" r="7"></circle>
                        <path d="M21 21L15 15"></path>
                    </svg>
                    <input type="text" id="globalSearch" class="search-input" placeholder="🔍 Глобальный поиск по всем разделам...">
                </div>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar desktop-only">
                <nav class="sidebar-nav" id="desktopSidebarNav"></nav>
            </aside>
            <main class="main-content">
                <div class="content-header">
                    <h2 class="content-title" id="sectionTitle">⚖️ Уголовный кодекс</h2>
                    <div class="stats" id="stats"></div>
                </div>
                <div id="globalSearchResults" class="global-search-results" style="display: none;">
                    <div class="global-search-header">
                        <span>🔍 Результаты глобального поиска</span>
                        <button class="clear-search-btn" id="clearSearchBtn">✕ Очистить</button>
                    </div>
                    <div id="globalSearchList" class="articles-list"></div>
                </div>
                <div class="filters-bar" id="filtersBar"></div>
                <div id="loadingSpinner" style="display:none; text-align:center; padding:40px; color:#888;">
                    ⏳ Загрузка...
                </div>
                <div class="articles-list" id="articlesList"></div>
            </main>
        </div>
    </div>

    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
    <div class="mobile-sidebar" id="mobileSidebar">
        <div class="mobile-sidebar-header">
            <span class="mobile-sidebar-title">📚 Меню</span>
            <button class="mobile-sidebar-close" id="closeSidebarBtn">✕</button>
        </div>
        <nav class="sidebar-nav" id="mobileSidebarNav"></nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
